# Example configuration for training-stats.
# Copy to config.toml and adjust. Secrets never belong in this file:
# they are read from environment variables (see .env.example).

[application]
name = "training-stats"
log_level = "INFO"
timezone = "Europe/Berlin"

[cache]
directory = "./data/cache"
# Wait budget for the app-wide cache lock: exactly one process (the server
# or one CLI command) may operate on the cache; while the server runs, CLI
# commands fail after this timeout — use the REST API instead.
lock_timeout_seconds = 30
# Throttle for automatic syncs: a real sync runs at most once per interval
# (anchored at the last_sync timestamp in metadata.json). 0 always
# synchronizes; --no-sync / list's flag skips syncing entirely.
sync_min_interval_seconds = 10
# High-frequency FIT record data is never persisted; retained only in memory
# during processing. Per-activity derived metrics are stored in
# training_cache.json. Daily/weekly summaries and training form are derived
# on read, not stored.

[athlete]
max_heart_rate = 180
resting_heart_rate = 55
# Optional:
# primary_goal = "Improve aerobic base"
# weight_kg = 80.0
# ftp_watts = 220

[athlete.heart_rate_zones]
z1_min = 90
z1_max = 108
z2_min = 109
z2_max = 126
z3_min = 127
z3_max = 144
z4_min = 145
z4_max = 162
z5_min = 163
z5_max = 180

[quality]
moving_speed_threshold_mps = 1.0
activity_gap_threshold_s = 900.0
activity_distance_gap_threshold_m = 500.0
minimum_segment_duration_s = 300.0
decoupling_min_duration_s = 1200.0
decoupling_min_coverage = 0.80
speed_thresholds_kmh = [20.0, 25.0, 30.0, 35.0]
cadence_min_coverage = 0.50

# ----- Input sources ---------------------------------------------------------
# Multiple sources are supported; every entry is active.

[[sources]]
name = "garmin-local"
type = "local"
# Local source: point at a folder containing FIT files. In Docker/Podman,
# mount your host folder at /data/activities (see docker-compose.yml).
path = "/data/activities"
recursive = true
# follow_symlinks = false

[[sources]]
name = "nextcloud"
type = "webdav"
base_url = "https://cloud.example.com/remote.php/dav/files/USERNAME/"
path = "Garmin/Activities"
# Names of the environment variables holding the credentials:
username_env = "NEXTCLOUD_USERNAME"
password_env = "NEXTCLOUD_APP_PASSWORD"
verify_tls = true
timeout_seconds = 30
recursive = true

[server]
# Defaults for "training-stats server" (overridable via --host/--port).
host = "127.0.0.1"
port = 8000

# Optional shared-secret bearer auth for the REST API. Uncomment to require
# "Authorization: Bearer <token>" on every data request; the token value is
# read from the named environment variable at startup (see .env.example).
# Without this section the server accepts unauthenticated requests.
# [server.auth]
# token_env = "TRAINING_STATS_AUTH_TOKEN"
